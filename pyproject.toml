[tool.poetry]
name = "intent-drift-engine"
version = "0.1.0"
description = "Autonomous Intent Compilation, Multi-Intent Drift Detection & Adaptive Delegation Envelopes for Intent-Based Networking"
authors = ["Sathvikamary <sk0981@srmist.edu.in>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
aiohttp = "^3.10.0"
statsmodels = "^0.14.0"
numpy = "^1.26.0"
scipy = "^1.13.0"
networkx = "^3.3.0"
prometheus-client = "^0.21.0"
structlog = "^24.4.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.7.0"
mypy = "^1.11.0"
black = "^24.10.0"
httpx = "^0.27.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
